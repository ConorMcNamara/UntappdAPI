[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "untappd"
version = "0.1.0"
description = "A Python client for the Untappd API v4"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Conor McNamara" }]
keywords = ["untappd", "beer", "api", "client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
test = ["pytest>=9.0.3", "pytest-cov", "responses>=0.23"]
dev = [
    "untappd[test]",
    "ruff>=0.4",
    "mypy>=1.8",
    "types-requests",
    "pre-commit",
]

[project.urls]
Homepage = "https://github.com/ConorMcNamara/UntappdAPI"
Repository = "https://github.com/ConorMcNamara/UntappdAPI"

[tool.hatch.build.targets.wheel]
packages = ["src/untappd"]

[tool.ruff]
line-length = 88
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
source = ["untappd"]
